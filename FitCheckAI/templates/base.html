<!DOCTYPE html>
<html>
<head>
    <title>FitCheck AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }

        .navbar {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3">

    <a class="navbar-brand" href="/">🏋️ FitCheck AI</a>

    <div>

        {% if current_user.is_authenticated %}

            <a class="btn btn-outline-light btn-sm" href="/">Predict</a>
            <a class="btn btn-outline-light btn-sm" href="/history">History</a>
            <a class="btn btn-outline-light btn-sm" href="/analytics">Analytics</a>

            <!-- ✅ PROFILE ADDED HERE -->
            <a class="btn btn-outline-light btn-sm" href="/profile">Profile</a>

            <a class="btn btn-danger btn-sm" href="/logout">Logout</a>

        {% else %}

            <a class="btn btn-success btn-sm" href="/login">Login</a>
            <a class="btn btn-warning btn-sm" href="/register">Register</a>

        {% endif %}

    </div>

</nav>

<div class="container">

    {% block content %}{% endblock %}

</div>

</body>
</html>
