<!DOCTYPE html>
<html>
<head>
    <title>FitCheck AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0;
            padding: 20px;
        }

        .main-card {
            width: 100%;
            max-width: 650px;
            background: white;
            border-radius: 18px;

            padding: 30px 35px;

            box-shadow: 0 20px 50px rgba(0,0,0,0.4);

            border: 1px solid rgba(255,255,255,0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header p {
            color: gray;
            font-size: 14px;
        }

        label {
            font-weight: 500;
            margin-bottom: 5px;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px;
            border: 1px solid #dcdcdc;
        }

        .form-control:focus {
            border-color: #4a90e2;
            box-shadow: none;
        }

        .btn-analyze {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            font-weight: 600;

            padding: 12px;
            border-radius: 10px;

            border: none;

            transition: 0.3s ease;
        }

        .btn-analyze:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        .row-gap {
            display: grid;
            gap: 15px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: white;
            text-align: center;
            margin-bottom: 15px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.7);
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

<div>

    <div class="title">🏋️ FitCheck AI</div>
    <div class="subtitle">AI Smart Fitness & Body Analysis System</div>

    <div class="main-card">

        <div class="header">
            <h1>Smart Fitness Analyzer</h1>
            <p>Enter details to get AI-based health prediction</p>
        </div>

        <form action="/predict" method="POST" enctype="multipart/form-data" class="row-gap">

            <div>
                <label>Upload Body Image</label>
                <input type="file" name="image" class="form-control" required>
            </div>

            <div>
                <label>Height (cm / m)</label>
                <input type="number" step="0.01" name="height" class="form-control" placeholder="e.g. 170" required>
            </div>

            <div>
                <label>Weight (kg)</label>
                <input type="number" step="0.1" name="weight" class="form-control" placeholder="e.g. 70" required>
            </div>

            <div>
                <label>Age</label>
                <input type="number" name="age" class="form-control" placeholder="e.g. 22" required>
            </div>

            <div>
                <label>Gender</label>
                <select name="gender" class="form-control">
                    <option>Male</option>
                    <option>Female</option>
                </select>
            </div>

            <button type="submit" class="btn-analyze">
                🚀 Analyze My Body
            </button>

        </form>

    </div>

</div>

</body>
</html>
